name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Least-privilege default token for all CI jobs.
permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        go-version: [ '1.25' ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build project
        run: go build ./...

      - name: Check for race conditions
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Run code style and import order verification
        run: make verify

      - name: Check License Header
        uses: korandoru/hawkeye@7ffde2c5fd29f3c486e4a6510436dca54f386e2a # v6

  ci-gate:
    name: CI Gate
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    env:
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Require tests and builds to pass
        run: |
          echo "test=$TEST_RESULT"
          if [ "$TEST_RESULT" != "success" ]; then
            if [ "$TEST_RESULT" = "cancelled" ]; then
              echo "::error::test was cancelled"
            elif [ "$TEST_RESULT" = "skipped" ]; then
              echo "::error::test was skipped (no path filters exist; expected to always run)"
            else
              echo "::error::test did not succeed (result=$TEST_RESULT)"
            fi
            exit 1
          fi
